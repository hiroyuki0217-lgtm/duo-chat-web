<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://api.github.com">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Duo Chat</title>
<style>
:root { --bg:#fff; --side:#f3f3f5; --line:#e2e2e6; --me:#2f6df6; --meText:#fff; --bot:#efeff2; --text:#1c1c1e; --sub:#8a8a90; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#1c1c1e; --side:#252528; --line:#38383c; --bot:#2e2e32; --text:#f2f2f4; --sub:#8e8e93; }
}
* { box-sizing:border-box; }
body { margin:0; height:100vh; display:flex; font:14px/1.6 -apple-system,"Hiragino Sans",sans-serif; background:var(--bg); color:var(--text); }
aside { width:190px; background:var(--side); border-right:1px solid var(--line); padding:44px 10px 10px; display:flex; flex-direction:column; -webkit-app-region:drag; }
aside button, aside input { -webkit-app-region:no-drag; }
.room { display:flex; justify-content:space-between; align-items:center; width:100%; border:0; background:none; color:inherit; text-align:left; padding:8px 10px; border-radius:8px; font:inherit; cursor:pointer; }
.room.on { background:var(--line); }
.badge { background:var(--me); color:#fff; border-radius:9px; font-size:11px; padding:0 6px; }
.spacer { flex:1; }
#status { font-size:11px; color:var(--sub); padding:6px 10px; word-break:break-all; }
#status.err { color:#d33; }
#gear { border:0; background:none; color:var(--sub); cursor:pointer; text-align:left; padding:6px 10px; font:inherit; }
main { flex:1; display:flex; flex-direction:column; min-width:0; }
header { padding:14px 20px 10px; border-bottom:1px solid var(--line); font-weight:600; -webkit-app-region:drag; }
#log { flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:10px; }
.msg { max-width:78%; padding:8px 12px; border-radius:14px; background:var(--bot); white-space:pre-wrap; word-break:break-word; }
.msg.me { align-self:flex-end; background:var(--me); color:var(--meText); }
.who { font-size:11px; color:var(--sub); margin-bottom:2px; }
.msg.me .who { color:#dbe6ff; }
form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
textarea { flex:1; resize:none; height:56px; padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:inherit; font:inherit; }
#go { border:0; background:var(--me); color:#fff; border-radius:10px; padding:0 18px; font:inherit; cursor:pointer; }
dialog { border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--text); width:420px; }
dialog label { display:block; margin:10px 0 2px; font-size:12px; color:var(--sub); }
dialog input { width:100%; padding:6px 8px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:inherit; font:inherit; }
.row { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }

body { height:100dvh; }
@media (max-width:640px) {
  body { flex-direction:column; }
  aside { width:100%; flex-direction:row; align-items:center; padding:env(safe-area-inset-top) 6px 6px; border-right:0; border-bottom:1px solid var(--line); overflow-x:auto; }
  .room { width:auto; white-space:nowrap; gap:6px; }
  .spacer { display:none; }
  #status { display:none; }
  #gear { margin-left:auto; white-space:nowrap; }
  header { display:none; }
  textarea, dialog input { font-size:16px; }
  dialog { width:92vw; }
  .msg { max-width:88%; }
  form { padding-bottom:calc(12px + env(safe-area-inset-bottom)); }
}
</style>
</head>
<body>
<aside>
  <button class="room on" data-room="muse"><span>ミューズ</span><span class="badge" hidden></span></button>
  <button class="room" data-room="grokbot"><span>Grok Bot</span><span class="badge" hidden></span></button>
  <button class="room" data-room="all"><span>ふたり同時</span><span class="badge" hidden></span></button>
  <div class="spacer"></div>
  <div id="status">接続中…</div>
  <button id="gear">設定</button>
</aside>
<main>
  <header id="title">ミューズ</header>
  <div id="log"></div>
  <form id="form">
    <textarea id="input" placeholder="Enterで送信 / Shift+Enterで改行"></textarea>
    <button id="go" type="submit">送信</button>
  </form>
</main>
<dialog id="dlg">
  <form method="dialog" id="cfgForm">
    <label>リポジトリ（owner/name）</label><input id="cRepo">
    <label>ブランチ</label><input id="cBranch">
    <label>自分の名前（from）</label><input id="cMe">
    <label>GitHubトークン（空欄なら gh auth のものを使う）</label><input id="cToken" type="password" placeholder="変更するときだけ入力">
    <div class="row"><button type="button" id="cCancel">閉じる</button><button type="submit" id="cSave">保存</button></div>
  </form>
</dialog>
<script src="api-web.js"></script>
<script src="renderer.js"></script>
<script src="boot.js"></script>
</body>
</html>
