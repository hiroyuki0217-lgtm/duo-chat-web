<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://api.github.com">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Duo Chat</title>
<style>
:root {
  --bg:#fff; --side:#f6f6f8; --line:#e6e6ea; --me:#2f6df6; --meText:#fff; --bot:#efeff3;
  --text:#1c1c1e; --sub:#8a8a90; --sel:#e9e9ee; --chip:#f0f0f4;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#161618; --side:#1f1f22; --line:#2f2f33; --bot:#2a2a2e; --text:#f2f2f4; --sub:#8e8e93; --sel:#2c2c30; --chip:#2a2a2e; }
}
* { box-sizing:border-box; }
body { margin:0; height:100vh; display:flex; font:15px/1.55 -apple-system,"Hiragino Sans",sans-serif; background:var(--bg); color:var(--text); }
button { font:inherit; color:inherit; }

aside { width:260px; background:var(--side); border-right:1px solid var(--line); padding:44px 8px 8px; display:flex; flex-direction:column; gap:2px; -webkit-app-region:drag; }
aside button { -webkit-app-region:no-drag; }
.room { display:flex; align-items:center; gap:10px; width:100%; border:0; background:none; text-align:left; padding:9px 10px; border-radius:12px; cursor:pointer; }
.room:hover { background:var(--sel); }
.room.on { background:var(--sel); }
.av { flex:none; width:40px; height:40px; border-radius:50%; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:16px; }
.room .meta { flex:1; min-width:0; }
.room .name { font-weight:600; display:flex; justify-content:space-between; gap:6px; }
.room .time { font-weight:400; font-size:11px; color:var(--sub); }
.room .prev { font-size:12.5px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.badge { align-self:center; background:var(--me); color:#fff; border-radius:10px; font-size:11px; min-width:19px; text-align:center; padding:1px 6px; }
.spacer { flex:1; }
#gear { border:0; background:none; color:var(--sub); cursor:pointer; text-align:left; padding:8px 12px; font-size:13px; }

main { flex:1; display:flex; flex-direction:column; min-width:0; }
header { display:flex; align-items:center; gap:10px; padding:12px 20px; border-bottom:1px solid var(--line); -webkit-app-region:drag; }
header .av { width:34px; height:34px; font-size:14px; }
#title { font-weight:600; line-height:1.2; }
#status { font-size:11.5px; color:var(--sub); }
#status.err { color:#e0453a; }
#status.ok::before { content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:#34c759; margin-right:5px; vertical-align:1px; }

#log { flex:1; overflow-y:auto; padding:14px 18px 8px; display:flex; flex-direction:column; }
.day { align-self:center; margin:14px 0 8px; font-size:11.5px; color:var(--sub); background:var(--chip); padding:2px 12px; border-radius:10px; }
.empty { margin:auto; color:var(--sub); font-size:13px; }
.row { display:flex; align-items:flex-end; gap:8px; margin-top:2px; }
.row.first { margin-top:10px; }
.row.me { flex-direction:row-reverse; }
.row .av { width:34px; height:34px; font-size:13px; }
.row .av.ghost { visibility:hidden; }
.col { display:flex; flex-direction:column; max-width:72%; min-width:0; }
.row.me .col { align-items:flex-end; }
.nm { font-size:11.5px; color:var(--sub); margin:0 0 2px 4px; }
.line { display:flex; align-items:flex-end; gap:6px; }
.row.me .line { flex-direction:row-reverse; }
.bub { padding:8px 13px; border-radius:18px; background:var(--bot); white-space:pre-wrap; word-break:break-word; }
.row:not(.me) .bub { border-bottom-left-radius:6px; }
.row.me .bub { background:var(--me); color:var(--meText); border-bottom-right-radius:6px; }
.tm { font-size:10.5px; color:var(--sub); white-space:nowrap; padding-bottom:2px; }

#form { display:flex; align-items:flex-end; gap:8px; padding:10px 16px 14px; }
#input { flex:1; resize:none; max-height:140px; min-height:40px; padding:9px 16px; border-radius:20px; border:1px solid var(--line); background:var(--side); color:inherit; font:inherit; line-height:1.45; outline:none; }
#input:focus { border-color:var(--me); }
#go { flex:none; width:40px; height:40px; border:0; border-radius:50%; background:var(--me); color:#fff; font-size:18px; cursor:pointer; }
#go:disabled { background:var(--line); color:var(--sub); cursor:default; }

dialog { border:1px solid var(--line); border-radius:14px; background:var(--bg); color:var(--text); width:420px; }
dialog form { display:block; padding:0; }
dialog label { display:block; margin:10px 0 2px; font-size:12px; color:var(--sub); }
dialog input { width:100%; padding:7px 9px; border-radius:8px; border:1px solid var(--line); background:var(--side); color:inherit; font:inherit; }
.btns { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
.btns button { padding:6px 14px; border-radius:8px; border:1px solid var(--line); background:var(--side); cursor:pointer; }
.btns #cSave { background:var(--me); color:#fff; border-color:var(--me); }

body { height:100dvh; }
@media (max-width:640px) {
  body { flex-direction:column; }
  aside { width:100%; flex-direction:row; align-items:center; gap:4px; padding:calc(env(safe-area-inset-top) + 6px) 8px 6px; border-right:0; border-bottom:1px solid var(--line); overflow-x:auto; }
  .room { width:auto; padding:5px 10px 5px 6px; gap:7px; border-radius:20px; white-space:nowrap; }
  .room .av { width:26px; height:26px; font-size:12px; }
  .room .prev, .room .time { display:none; }
  .spacer { display:none; }
  #gear { margin-left:auto; white-space:nowrap; }
  header { padding:8px 14px; }
  #log { padding:10px 12px 6px; }
  #input, dialog input { font-size:16px; }
  dialog { width:92vw; padding:16px; }
  .col { max-width:80%; }
  #form { padding:8px 12px calc(10px + env(safe-area-inset-bottom)); }
}
</style>
</head>
<body>
<aside>
  <button class="room on" data-room="muse"><span class="av"></span><span class="meta"><div class="name"><span>ミューズ</span><span class="time"></span></div><div class="prev"></div></span><span class="badge" hidden></span></button>
  <button class="room" data-room="grokbot"><span class="av"></span><span class="meta"><div class="name"><span>Grok Bot</span><span class="time"></span></div><div class="prev"></div></span><span class="badge" hidden></span></button>
  <button class="room" data-room="all"><span class="av"></span><span class="meta"><div class="name"><span>ふたり同時</span><span class="time"></span></div><div class="prev"></div></span><span class="badge" hidden></span></button>
  <div class="spacer"></div>
  <button id="gear">設定</button>
</aside>
<main>
  <header>
    <span class="av" id="hav"></span>
    <div><div id="title">ミューズ</div><div id="status">接続中…</div></div>
  </header>
  <div id="log"></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="メッセージ"></textarea>
    <button id="go" type="submit" disabled aria-label="送信">↑</button>
  </form>
</main>
<dialog id="dlg">
  <form method="dialog" id="cfgForm">
    <label>リポジトリ（owner/name）</label><input id="cRepo">
    <label>ブランチ</label><input id="cBranch">
    <label>自分の名前（from）</label><input id="cMe">
    <label>GitHubトークン（空欄なら gh auth のものを使う）</label><input id="cToken" type="password" placeholder="変更するときだけ入力">
    <div class="btns"><button type="button" id="cCancel">閉じる</button><button type="submit" id="cSave">保存</button></div>
  </form>
</dialog>
<script src="api-web.js"></script>
<script src="renderer.js"></script>
<script src="boot.js"></script>
</body>
</html>
